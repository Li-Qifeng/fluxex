name: Build and Release

on:
  push:
    tags:
      - 'v*'

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            arch: arm64-v8a
            flutter-target: android-arm64
          - platform: android
            os: ubuntu-latest
            arch: armeabi-v7a
            flutter-target: android-arm
          - platform: android
            os: ubuntu-latest
            arch: x86_64
            flutter-target: android-x64
          - platform: ios
            os: macos-latest
          - platform: macos
            os: macos-latest
            arch: universal
          - platform: windows
            os: windows-latest
            arch: x86_64
          - platform: linux
            os: ubuntu-latest
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Java
        if: startsWith(matrix.platform, 'android')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android Signing
        if: startsWith(matrix.platform, 'android')
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" > android/key.properties

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android
        if: startsWith(matrix.platform, 'android')
        run: |
          flutter build apk --release --target-platform ${{ matrix.flutter-target }}
          mkdir -p dist
          mv build/app/outputs/flutter-apk/app-release.apk dist/v2ex_client-${{ matrix.arch }}.apk

      - name: Build iOS
        if: matrix.platform == 'ios'
        run: |
          flutter build ios --release --no-codesign
          mkdir -p dist
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../../dist/v2ex_client-unsigned.ipa Payload

      - name: Build macOS
        if: matrix.platform == 'macos'
        run: |
          flutter build macos --release
          mkdir -p dist
          cd build/macos/Build/Products/Release
          zip -r ../../../../../dist/v2ex_client-macos.zip v2ex_client.app

      - name: Build Windows
        if: matrix.platform == 'windows'
        run: |
          flutter build windows --release
          mkdir -p dist
          cd build/windows/x64/runner/Release
          7z a ../../../../../dist/v2ex_client-windows.zip *

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: |
          flutter build linux --release
          mkdir -p dist
          cd build/linux/x64/release/bundle
          tar czf ../../../../../dist/v2ex_client-linux.tar.gz *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
