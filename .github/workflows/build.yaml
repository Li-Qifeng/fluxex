name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            arch: arm64-v8a
            flutter-target: android-arm64
          - platform: android
            os: ubuntu-latest
            arch: armeabi-v7a
            flutter-target: android-arm
          - platform: android
            os: ubuntu-latest
            arch: x86_64
            flutter-target: android-x64
          - platform: ios
            os: macos-latest
          - platform: macos
            os: macos-latest
            arch: universal
          - platform: windows
            os: windows-latest
            arch: x86_64
          - platform: linux
            os: ubuntu-latest
            arch: x86_64
          - platform: web
            os: ubuntu-latest
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java
        if: startsWith(matrix.platform, 'android')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache Gradle wrapper
        if: startsWith(matrix.platform, 'android')
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Setup Android Signing
        if: startsWith(matrix.platform, 'android')
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" > android/key.properties

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev

      - name: Get dependencies
        run: flutter pub get

      - name: Patch google_fonts for Dart 3.12+
        run: |
          PUB_CACHE_DIR="$PUB_CACHE"
          if [ -z "$PUB_CACHE_DIR" ]; then
            PUB_CACHE_DIR=$(flutter pub config cache-dir 2>/dev/null || echo "$HOME/.pub-cache")
          fi
          TARGET="$PUB_CACHE_DIR/hosted/pub.dev/google_fonts-6.1.0/lib/src/google_fonts_variant.dart"
          if [ -f "$TARGET" ]; then
            sed -i.bak 's/^const _fontWeightToFilenameWeightParts = {/final _fontWeightToFilenameWeightParts = {/' "$TARGET"
            echo "Patched google_fonts at $TARGET"
            grep "_fontWeightToFilenameWeightParts" "$TARGET" | head -1
          else
            echo "File not found: $TARGET"
            exit 1
          fi
        shell: bash

      - name: Build Android
        if: startsWith(matrix.platform, 'android')
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release --target-platform ${{ matrix.flutter-target }} && break
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep $((attempt * 20))
          done
          mkdir -p dist
          mv build/app/outputs/flutter-apk/app-release.apk dist/fluxex-${{ matrix.arch }}.apk

      - name: Build iOS
        if: matrix.platform == 'ios'
        run: |
          flutter build ios --release --no-codesign
          mkdir -p dist
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../../../dist/fluxex-unsigned.ipa Payload

      - name: Build macOS
        if: matrix.platform == 'macos'
        run: |
          flutter build macos --release
          mkdir -p dist
          cd build/macos/Build/Products/Release
          mv *.app fluxex.app || true
          zip -r ../../../../../dist/fluxex-macos.zip fluxex.app

      - name: Build Windows
        if: matrix.platform == 'windows'
        run: |
          flutter build windows --release
          mkdir -p dist
          cd build/windows/x64/runner/Release
          7z a ../../../../../dist/fluxex-windows.zip *

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: |
          flutter build linux --release
          mkdir -p dist
          cd build/linux/x64/release/bundle
          tar czf ../../../../../dist/fluxex-linux.tar.gz *

      - name: Build Web
        if: matrix.platform == 'web'
        run: |
          flutter build web --release
          mkdir -p dist
          cd build/web
          zip -r ../../dist/fluxex-web.zip *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/

  release:
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare dist directory
        run: |
          mkdir -p dist
          find artifacts -type f -exec mv {} dist/ \;
          ls -la dist/

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
